# Docker Compose ollama profile — same as config.yaml but points at the ollama service.
llm:
  provider: ollama
  remote_guard:
    max_chat_requests_per_run: 45
    max_generate_requests_per_run: 150
    max_llm_requests_per_run: 220
    max_total_token_count_per_run: 400000
    warn_token_threshold: 120000

gemini:
  api_key_env: GOOGLE_API_KEY
  reasoning_model: gemini-2.5-flash
  vision_model: gemini-2.5-pro
  timeout_generate_s: 600

ollama:
  base_url: "http://ollama:11434"
  vision_model: "qwen2.5vl:32b"
  reasoning_model: "qwen3:1.7b"
  timeout_chat_s: 240
  timeout_generate_s: 420
  num_ctx_chat: 8192
  num_ctx_generate: 16384

config_dir: "config/csv"

learnings_path: "learnings/learnings.md"

agent:
  max_turns: 30
  max_field_retries: 5
  confidence_threshold: 0.65
  batch_review_threshold: 0.85
  planning_enabled: true
  fallback_reasoning_model: null
  orchestration: "loop"
  loop_profile: "patterned"
  tool_groups_enabled: ["pipeline"]
  tools_extra_allow: []
  tools_extra_deny: ["install_package"]
  learnings_tools_enabled: false
  prompt_profile: auto
  learnings_inject_enabled: true
  learnings_max_chars: 16000
  planning_learnings_max_chars: null
  log_line_max_chars: 250
  history_preview_chars: 900
  state_summary_max_page_lines: 28
  state_summary_max_inventory_lines: 50
  state_summary_inventory_desc_chars: 180
  ocr_prompt_max_chars: 24000
  visual_max_evidence_pages: 8
  active_rule_groups:
    - general
    - aexcid
  ground_truth_csv_path: "config/csv/ground_truth.csv"
  ground_truth_csv_by_invoice_type: {}
  ground_truth_source_column: "Source file"
  ground_truth_column_map:
    "Invoice Number": "invoice_number"
    "Date": "invoice_date"
    "Supplier/Issuer": "vendor_name"
    "Items/Services": "item_description"
    "Description": "travel_purpose"
    "Total Amount": "total_amount"
    "Currency": "currency"
    "Payment Method": "payment_method"
    "Expense Category": "expense_category"
    "Client Name": "beneficiary"
    "Employee": "employee_name"
    "Pay period": "pay_period"
  ground_truth_date_parse: "DMY"
  micro_tools_phase2: false
  batch_auto_expand: true
  hybrid_extraction: false
  page_dpi: 200
  planning_timeout_s: 180
  reflection_timeout_s: 120
  max_consecutive_failures: 3
  max_same_action_warn: 2
  max_same_action_stop: 5

ocr:
  langs: ["es", "en", "fr"]

output:
  base_dir: "output"
  include_page_crops: true

logging:
  level: "INFO"

# Project and funder values referenced by compliance rules as {project.<key>} / {compliance.<key>}
# placeholders in config/csv/compliance_rules.csv (check_value). A rule whose placeholder is unset
# is reported as "Not configured" and skipped; it does not fail the invoice or block finish.
project:
  # AEXCID project file number (expediente) printed on the funding stamp. Empty: any number accepted.
  file_number: ""
  # Implementation period, YYYY-MM-DD. Empty: the execution-period rules are skipped.
  start_date: ""
  end_date: ""
  # Full legal names accepted as the invoice client/payer: beneficiary organisation, consortium
  # partners, local partner. Empty: the client rule only requires a full legal name, not a match.
  payer_legal_names: []

compliance:
  # Units of each currency per 1 EUR. Used to convert amounts for EUR limits (cash limit, per-diem caps)
  # and shown to the vision model next to EUR thresholds. XAF/XOF are pegged at 655.957 per EUR.
  currency_per_eur:
    EUR: 1
    XAF: 655.957
    XOF: 655.957
    CFA: 655.957
    FCFA: 655.957
  # AEXCID Decree 5/2019 limits (Normas de seguimiento y justificación).
  cash_limit_eur: 2500                       # cash payments must be below this (4.2.3, PDF p.16)
  three_quotes_supplies_eur: 15000           # supplies, equipment, services: three quotes above this (PDF p.23, p.29)
  three_quotes_works_eur: 40000              # construction works: three quotes above this (PDF p.21)
  accommodation_abroad_max_eur_per_day: 143  # A.6, VAT included
  subsistence_abroad_max_eur_per_day: 95     # A.6, VAT included
  fuel_max_eur_per_km: 0.21                  # A.6, when fuel is claimed per km
